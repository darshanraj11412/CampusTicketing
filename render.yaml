services:
  - type: web
    name: campus-ticketing
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm --prefix client install --include=dev && npm --prefix client run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: DEMO_ACCOUNT_PASSWORD
        sync: false
