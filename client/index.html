<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233b82f6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2Z'/><path d='M13 5v2'/><path d='M13 17v2'/><path d='M13 11v2'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Event Ticketing | RV University</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Helpful guide if accidentally opened via VS Code Live Server (port 5500)
      if (window.location.port === '5500' || window.location.protocol === 'file:') {
        window.addEventListener('DOMContentLoaded', () => {
          setTimeout(() => {
            const root = document.getElementById('root');
            if (root && root.children.length === 0) {
              root.innerHTML = `
                <div style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #090d16; color: #f8fafc; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem;">
                  <div style="background: #1e293b; padding: 2.5rem; border-radius: 16px; max-width: 540px; text-align: center; border: 1px solid rgba(255,255,255,0.12); box-shadow: 0 20px 50px rgba(0,0,0,0.6);">
                    <div style="font-size: 2.5rem; margin-bottom: 1rem;">⚡</div>
                    <h2 style="color: #38bdf8; margin-bottom: 0.75rem; font-size: 1.5rem;">Full-Stack React App</h2>
                    <p style="color: #94a3b8; font-size: 0.95rem; line-height: 1.6; margin-bottom: 1.5rem;">
                      VS Code's "Live Server" (port 5500) cannot run React JSX or WebSockets. Please run the app using the terminal:
                    </p>
                    <div style="background: #0f172a; padding: 1rem 1.25rem; border-radius: 10px; font-family: monospace; font-size: 0.95rem; color: #34d399; margin-bottom: 1.5rem; text-align: left; border: 1px solid rgba(255,255,255,0.06);">
                      $ npm start<br>
                      <span style="color: #64748b; font-size: 0.8rem;">➜ Open: http://localhost:5000</span>
                    </div>
                    <a href="http://localhost:5000" style="display: inline-block; background: #3b82f6; color: white; padding: 0.75rem 1.75rem; border-radius: 10px; text-decoration: none; font-weight: 600; font-size: 0.95rem;">
                      Open http://localhost:5000 →
                    </a>
                  </div>
                </div>
              `;
            }
          }, 600);
        });
      }
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
